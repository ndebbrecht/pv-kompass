stages: [test, beta]
default:
  tags: [mac]
variables:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_CHANGELOG: '1'
test:
  stage: test
  script:
    - xcodegen generate
    - xcodebuild -project PVKompass.xcodeproj -scheme PVKompass -destination 'platform=iOS Simulator,name=PV Kompass Test' -parallel-testing-enabled NO -derivedDataPath build/DerivedData -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
  artifacts:
    when: always
    paths: [build/TestResults.xcresult]
    expire_in: 14 days
beta:
  stage: beta
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - python3 -m venv build/release-venv
    - build/release-venv/bin/pip install -r scripts/requirements-release.txt
    - python3 scripts/ci-api-key.py
    - ASC_API_KEY_JSON=build/asc-api-key.json build/release-venv/bin/python scripts/prepare-signing.py
    - xcodegen generate
    - xcodebuild -project PVKompass.xcodeproj -scheme PVKompass -configuration Release -destination 'generic/platform=iOS' -archivePath build/PVKompass.xcarchive CURRENT_PROJECT_VERSION="$CI_PIPELINE_IID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER='PV Kompass App Store' archive
    - xcodebuild -exportArchive -archivePath build/PVKompass.xcarchive -exportPath build/export -exportOptionsPlist scripts/ExportOptions.plist
    - fastlane pilot upload --ipa build/export/PVKompass.ipa --api_key_path build/asc-api-key.json
  after_script:
    - python3 -c 'from pathlib import Path; p=Path("build/asc-api-key.json"); p.unlink(missing_ok=True)'
  artifacts:
    paths: [build/export/PVKompass.ipa]
    expire_in: 14 days
